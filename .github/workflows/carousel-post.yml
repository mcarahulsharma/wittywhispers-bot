name: Post carousel

on:
  schedule:
    - cron: "30 3 * * *"   # every day at 03:30 UTC = 09:00 AM IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: post-quote
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pillow

      - name: Generate carousel slides
        run: python carousel.py generate

      - name: Push slides so Instagram can fetch them
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add posts
          git commit -m "Add carousel slides" || echo "nothing to commit"
          git pull --rebase
          git push

      - name: Post to Instagram
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python carousel.py post

      - name: Save progress
        run: |
          git add carousel_state.json
          git commit -m "Update carousel state" || echo "nothing to commit"
          git pull --rebase
          git push
